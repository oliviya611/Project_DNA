<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - ProjectDNA</title><link rel="stylesheet" href="css/style.css"></head><body class="login-bg"><div class="form-card"><a class="back" href="index.html">← Back to login</a><h1>Create Account</h1><p>Join ProjectDNA and find your next project team.</p><form id="registerForm"><label>Full Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><label>Account Type</label><select id="type"><option value="student">Student</option><option value="creator">Project Creator</option></select><div id="studentFields"><label>Interests</label><input id="interests" placeholder="AI, Data Science, Web Development"><label>Skills</label><input id="skills" placeholder="Python, Java, SQL"></div><div id="creatorFields" class="hidden"><label>Organization / Department</label><input id="organization"><label>Area of Expertise</label><input id="expertise"></div><button class="primary" type="submit">Create Account</button></form><div id="msg" class="msg"></div></div><script src="js/app.js"></script></body></html>
